<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <link rel="stylesheet" href="/Projects/Counter App/style.css">
</head>
<body>

<div class="container">

    <div class="box">
        <h1>People Entered:</h1>
        <h2 id="count-el">0</h2>
    </div>

    <div class="button">
        <button id="increment-btn" onclick="increment()">INCREMENT</button>
        <button id="increment-btn" onclick="reset()">RESET</button>
        <button id="increment-btn" onclick="decrement()">DECREMENT</button>
    </div>

    <button id="save" onclick="save()">SAVE</button>
    <p id="entries"><em>Previous entries:</em> <span id="entry"></span></p>

</div>

  <script src="/Projects/Counter App/script.js"></script>
</body>
</html>
